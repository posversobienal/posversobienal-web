  Pectoral. FECHA: 2026. TÉCNICA: Bordado, ensamble. MATERIALES: Tela de algodón. Hojas. Hilos. Lana. Metal. MEDIDAS: 207 x 50 x 3 cm.

contenido: |
  El espacio entre mundos es un entre-lugar que abre puertas y genera tensiones. Es un umbral para retomar, continuar y profundizar el diálogo con las vitalidades no humanas, suspendiendo el binarismo y el racionalismo que suelen cercar esta posibilidad.

  Como una segunda piel, este pectoral pretende ser la fuerza que nos permita respirar en esos espacios no catalogados, apenas vislumbrados y nombrados. La pieza busca recrear la crianza mutua, tal como nos alienta Elvira Espejo.

  Así, este pectoral instalado se despliega como un mundo de gestos blandos creados en capas superpuestas; una materialización de lo que subyace, lo que nos recorre, la memoria oral y la percepción de otras energías, tanto presentes como ficcionalizadas.

  Forma parte de una instalación y performance que se realizará en sitio especifico.
