ficha: |
  Dispositivo de destilación y difusión de esencia sónico-olfativa. FECHA: 2022. MATERIALES: Texturas sonoras (basadas en las Gnossiennes de Erik Satie), perfume ("Turn on your inner sun", formulado con esencias solares según la mística del Antiguo Egipto).

contenido: |
  El título de la obra apela a la célebre máxima alquímica medieval: *Visita Interiora Terrae Rectificando Invenies Occultum Lapidem* ("Visita el interior de la tierra y rectificando encontrarás la piedra oculta"). De acuerdo a este principio, *V.I.T.R.I.O.L.* se presenta no solo como una instalación artística, sino como un dispositivo de transmutación perceptual y espiritual.

  A través de un aparato físico que destila y difunde una esencia sónico-olfativa, los artistas proponen un viaje hacia el interior del sujeto. La obra opera en el cruce de dos lenguajes tradicionalmente invisibles: el sonido y el aroma, fuerzas etéreas que modifican el espacio y el estado de conciencia del espectador sin apelar a la primacía de la mirada.

  El perfume utilizado, "*Turn on your inner sun*" (Enciende tu sol interior), está compuesto por esencias solares de la tradición egipcia diseñadas específicamente para activar la energía vital del individuo.

  *V.I.T.R.I.O.L.* desafía la alienación del mundo contemporáneo mediante una experiencia inmersiva sinestésica. El sonido de Satie, deconstruído y expandido en texturas contemporáneas, se funde con las moléculas del perfume egipcio en el aire. No se trata de música con aroma, sino de una sustancia artística unificada. El olfato, el más primitivo y ligado a la memoria de nuestros sentidos, trabaja junto a la audición para disolver el caos del entorno exterior.
