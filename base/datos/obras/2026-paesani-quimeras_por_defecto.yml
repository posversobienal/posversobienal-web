  Dibujo. FECHA: 2026. MATERIALES: Tinta líquida y tinta seca, hoja devastadora pincel, pluma, escobillas naturales.  MEDIDAS: Políptico, 4 piezas de 50 x 50 cm.

contenido: |

  Romina Paesani presenta una serie de dibujos compuestos en tinta sobre papel, en la que despliega un desconcertante bestiario personal que se resiste a cualquier clasificación.

  Las criaturas que materializa no provienen del pasado ni de los repertorios fantásticos de la literatura, sino que emergen de una mirada sarcástica y despiadada que engendra monstruos a partir de la realidad inmediata. Sus criaturas sintomatizan la monstruosidad y la crueldad de nuestro presente.

  En sus dibujos, el terror asume la forma de seres híbridos, en los que se mixturan desaforadamente rasgos de humanos y de animales. En las frases-título que acompañan cada ilustración se revelan inequívocas referencias políticas, sociales y culturales.

  A primera vista, los dibujos parecen provenir de un desvarío onírico, pero detrás del inevitable barniz surrealista se agitan pesadillas más preocupantes y más estremecedoras que las que puede pergeñar el inconsciente.

  Las criaturas que Paesani alumbra y extrae de la oscuridad nos hablan de terrores contemporáneos, de maldades que solo pueden representarse a través del espejo de lo deforme y lo monstruoso. Sus criaturas, en las que se desbordan las fronteras entre lo vivo y lo muerto, entre lo humano y lo no humano, entre lo existente y lo inexistente, ya no disputan sus batallas en el campo de la imaginación de los hombres, sino en el de nuestra inquietante actualidad.
