contenido: |
  En el dibujo *Ciudad de pájaros perdidos y seres sin recuerdos*, Sandra Pintos emplea la imaginería fantástica como interfaz entre pasado y presente, entre los fantasmales horrores medievales y los horrores del mundo contemporáneo. La obra pertenece a la serie La aldea de los caídos, en la que la artista recurre a un profuso buceo y proceso de apropiación y actualización de fantasías de maestros renacentistas y góticos, como Masaccio, Pisanello, Piero della Francesca, Giotto y Paolo Ucello. Esta estrategia creativa hace que la serie funcione como un puente entre dos mundos: pasado y presente se funden y se confunden.

  La obra, plena de densidad onírica, nos presenta una ciudad pesadillesca, donde figuras de mujeres son acosadas por pájaros que las picotean en la cabeza y en el cuerpo. A la plaga de los pájaros se suman otros seres minúsculos, pulgas, ácaros y gusanos, que provocan al espectador con una sensación casi física de malevolencia y repulsión. En la composición de la ciudad, enfatizando los tráficos entre pasado y presente, se mezclan elementos de una urbe renacentista con fachadas y referencias del propio barrio de la artista. El picoteo de los pájaros, que nos recuerda inevitablemente a Hitchcock, parece aludir a la inoculación de narrativas engañosas, capaces de adormecer la conciencia y extraviar el juicio. Como resultado, quedan esos extraños personajes que vagan por la ciudad vacía, como insomnes, delatando el síntoma de una sociedad lobotomizada, librada a los caprichos de algún tiranuelo de ultraderecha. El trasvase entre pasado y presente adquiere así dimensiones dramáticas, fuertemente penosas en nuestro contexto actual.

  En los bordes del dibujo, emerge la palabra poética, desatada en frases y anotaciones, revelando rastros del estado de trance de la propia artista al lidiar con sus oscuras ensoñaciones.
