contenido: |
  *Pousavam em núvens ralas* (Se posaban en nubes ralas) subvierte la lógica tradicional de la pantalla y el soporte audiovisual para construir un poema visual, táctil y sonoro en el espacio. Mediante una operación de extrañamiento objetual, el trabajo yuxtapone la pesadez de lo cotidiano con la inmaterialidad de lo etéreo, explorando las tensiones entre el cuerpo, la tecnologia, el desarraigo y la gravedad.

  La disposición de la obra plantea una paradoja visual y conceptual: el cielo, el sonido del viento y las nubes —elementos asociados históricamente a la altura, la inmensidad y lo sublime— son confinados al plano del suelo, atrapados dentro de un dispositivo tecnológico. Al presentar un par de zapatos sobre la pantalla, la obra activa una metáfora de "caminar sobre el cielo". Esta inversión de la gravedad subvierte la percepción del espectador y desplaza la noción de horizonte.

  Los zapatos evocan un cuerpo que ya no está, un sujeto ausente que ha dejado su rastro. Caída, o caminata en el cielo, la pieza funciona como alusión al fin de todas las certidumbres. En un mundo distópico y exhausto, nada es perdurable. El cielo ha caído, y los pasos difuminan la línea entre la realidad y el sueño.
