contenido: |
  *No todas las banderas, pero siempre una bandera.*

  Llevar una bandera como modo vital de flamear el lenguaje. Ese es nuestro sistema de obra.

  La sutil y sostenida unión entre una tela blanca, nuestros cuerpos y los territorios una y otra vez. Cada paso que damos juntas nos hace latir el corazón con el pulso de la memoria y lo que ella escribe en el mañana.

  Porque no olvidamos, no indultamos, no nos reconciliamos con ningún genocida.

  Y porque creemos en la  fuerza estética de la política.

  Y porque todo lo que sabemos de su potencia lo aprendimos de Madres y Abuelas.
