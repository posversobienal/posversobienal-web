contenido: |
  *Grounding* es un ritual artístico en el que se sacrifica un instrumento musical totalmente nuevo a medida que se toca. El artista, vestido con un traje negro, camina a un ritmo ceremonialmente lento. Tras él arrastra un amplificador de guitarra en un carretilla, y una icónica guitarra eléctrica, una Fender Stratocaster, se desliza con las cuerdas apuntadas hacia abajo, siendo ejecutada por el propio suelo.

  Roi Vaara subvierte la función tradicional de la guitarra eléctrica para transformarla en un transductor de la materia y el territorio. Al arrastrar el instrumento directamente sobre el suelo, el artista renuncia a la ejecución virtuosa del sujeto y cede la autoría sonora a la fricción cruda, azarosa e inevitable entre el objeto y el pavimento.

  La obra opera como una "toma de tierra" literal y metafórica. El circuito eléctrico ya no responde a la codificación de los acordes, sino a las irregularidades, texturas y resistencias del entorno. Este acto de enraizamiento genera una sonoridad completamente autónoma: un flujo de interferencias y ruidos que emergen del propio desgaste del arrastre.

  La obra se ha interpretado nueve veces en diferentes países europeos y una vez en Nueva York. En cada ocasión, se ha adquirido una nueva guitarra Stratocaster icónica exclusivamente para la interpretación. El estreno tuvo lugar en Hungría en 2018. Un videoclip de la performance en el festival Live Action 14 de Gotemburgo, Suecia, en 2019, recibió más de 1,7 millones de visitas en Facebook.
