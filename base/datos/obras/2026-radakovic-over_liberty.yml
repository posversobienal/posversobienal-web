contenido: |
  *OVER LIBERTY* es una instalación escultórica y conceptual compuesta por 14 cajas de cartón modulares. Cada una de las cajas lleva inscrita una letra, dispuestas de manera precisa en dos líneas superpuestas de siete bloques cada una. La configuración espacial establece un juego tipográfico y estructural directo: la palabra *TIRANNY* (Tiranía) se erige físicamente sobre la palabra *LIBERTY* (Libertad).

  La obra utiliza la literalidad física como metáfora política. Al colocar *TIRANNY* sobre *LIBERTY*, Radaković no solo propone una lectura semántica, sino una relación de fuerzas físicas: la tiranía ejerce una presión gravitatoria, un peso real y aplastante sobre la libertad. La libertad aparece aquí como la base, el cimiento que soporta el peso del régimen, sugiriendo que los sistemas opresivos siempre se sostienen a expensas y sobre el cuerpo de las libertades preexistentes.

  *OVER LIBERTY* es una advertencia visual y una radiografía del panorama socio-político contemporáneo. Darija Radaković logra, mediante una economía de recursos extrema y una sutil ironía geométrica, condensar la tensión histórica entre opresión y emancipación. La obra deja una pregunta abierta en el espacio: ¿puede la base resistir el peso, o está el sistema destinado al derrumbe?
