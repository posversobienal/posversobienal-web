  Videoperformance digital. FECHA: 2026. DURACIÓN: 9' 33". EDICIÓN: Julia Borst.

contenido: |
  *Searching for Liza* es una videoperformance de 9 minutos y 33 segundos que documenta un acto de resistencia poética frente a la obsolescencia: el intento de una mujer por reparar un reproductor de casetes defectuoso y una cinta rota para escuchar una melodía romántica específica ("Liza").

  Registrado desde una perspectiva íntima a través de una cámara sujeta al cuello de la propia artista, el video se transforma en el testimonio de una búsqueda a ciegas. Desprovista de conocimientos técnicos en electrónica, la acción es impulsada únicamente por el deseo, la memoria afectiva y la persistencia.

  La obra rescata soportes mediáticos en desuso (el casete y el grabador portátil). Para la artista, cuya trayectoria profesional está ligada a la fonoaudiología y cuyas memorias de juventud incluyen listas de canciones grabadas de la radio, estos objetos funcionan como recipientes de afecto. De este modo, la pieza contrapone la frialdad de la tecnología digital contemporánea a la calidez táctil, imperfecta y nostálgica de los residuos analógicos.

  *Searching for Liza* culmina en un logro que, formalmente, podría considerarse mínimo frente a semejante esfuerzo: hacer que la cinta gire y la música suene. Sin embargo, es justamente en esa desproporción donde reside su fuerza política y poética.

  La obra se presenta como una metáfora de la existencia contemporánea: una jornada de experimentación, precariedad y fracasos en la que, a pesar de la aspereza del entorno y la falta de saberes técnicos, la obstinación humana logra arrancar un momento de placer, realización y superación.
