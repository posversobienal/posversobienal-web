contenido: |
  Una inundación, con flujo continuo, aparenta invadir una sala de estar. A pesar de la permanencia del fenómeno, nada sucede. La sala no reacciona, los objetos no se desplazan, no hay colapso visible. El espectador asiste a un anegamiento que parece inminente e interminable, suspendido en un presente continuo.

  El título condensa la experiencia central de la obra: *Latente* no nombra un acontecimiento, un desastre, sino su permanencia suspendida. El tiempo aquí no progresa, se espesa. Se instaura una fricción temporal en la que el presente se prolonga indefinidamente. El agua, la misma matriz de la que emergimos, asume aquí una ambigüedad inquietante: aquello que nos constituye es también aquello que puede aniquilarnos.

  El espectador permanece dentro del tiempo de la amenaza, inmerso en un presente continuo donde la catástrofe no estalla — perdura; un tiempo psicológico que evoca la sensación contemporánea de crisis constante.
