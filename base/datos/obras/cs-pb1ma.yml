                <rect x="8" y="7" width="2.5" height="10" fill="currentColor"/>
                <rect x="13.5" y="7" width="2.5" height="10" fill="currentColor"/>
            </svg>`,
                 volume: `
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>
                <path d="M15 8.5c1 1 1.5 2 1.5 3.5s-.5 2.5-1.5 3.5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                <path d="M17.5 6c2 2 3 4 3 6s-1 4-3 6" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/>
            </svg>`
             };

             // ===== ESTILOS =====
             const injectStyles = () => {
                 if (document.getElementById('audio-card-theme-styles')) return;
                 const style = document.createElement('style');
                 style.id = 'audio-card-theme-styles';
                 style.textContent = `
            #audio-card-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;
            display: none;
            width: 92vw;
            max-width: 360px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            }
            #audio-card-container.visible { display: block; }
            .audio-card {
            background: #141414;
            color: #e8e8e8;
            border: 1px solid #2a2a2a;
            padding: 22px 22px 18px;
            border-radius: 4px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.75);
            font-size: 12px;
            line-height: 1.5;
            position: relative;
            word-wrap: break-word;
            overflow-wrap: break-word;
            }
            .audio-card .close-btn {
            position: absolute;
            top: 8px;
            right: 10px;
            background: transparent;
            border: none;
            color: #888;
            font-size: 20px;
            cursor: pointer;
            line-height: 1;
            padding: 4px 8px;
            font-family: inherit;
            }
            .audio-card .close-btn:hover { color: #fff; }
            .audio-card .field { margin-bottom: 6px; }
            .audio-card .label {
            color: #777;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 10px;
            margin-right: 6px;
            }
            .audio-card .value { color: #e8e8e8; }
            .audio-card .title { font-weight: 600; margin-bottom: 14px; font-size: 13px; }
            .audio-card .controls {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid #222;
            }
            .audio-card .play-btn {
            background: transparent;
            color: #e8e8e8;
            border: none;
            padding: 0;
            cursor: pointer;
            line-height: 0;
            flex-shrink: 0;
            transition: color 0.15s ease;
            }
            .audio-card .play-btn:hover { color: #fff; }
            .audio-card .play-btn svg { display: block; }
            .audio-card .play-btn .icon-pause { display: none; }
            .audio-card .play-btn.playing .icon-play { display: none; }
            .audio-card .play-btn.playing .icon-pause { display: block; }

            .volume-control {
            position: relative;
            flex-shrink: 0;
            }
            .volume-icon-btn {
            background: transparent;
            border: none;
            color: #aaa;
            cursor: pointer;
            padding: 4px;
            line-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.15s ease;
            }
            .volume-icon-btn:hover,
            .volume-control.active .volume-icon-btn { color: #fff; }
            .volume-icon-btn svg { display: block; }
            .volume-slider-wrapper {
            position: absolute;
            bottom: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%);
            width: 32px;
            height: 110px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 16px rgba(0,0,0,0.6);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease, visibility 0.15s ease;
            visibility: hidden;
            }
            .volume-slider-wrapper::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 5px solid transparent;
            border-top-color: #2a2a2a;
            }
            .volume-control:hover .volume-slider-wrapper,
            .volume-control.active .volume-slider-wrapper {
            opacity: 1;
            pointer-events: auto;
            visibility: visible;
            }
            .volume-slider-wrapper .volume-track {
            width: 90px;
            height: 2px;
            background: #2a2a2a;
            transform: rotate(-90deg);
            transform-origin: center center;
            display: flex;
            align-items: center;
            justify-content: center;
            }
            .volume-slider-wrapper .volume {
            width: 90px;
            height: 2px;
            background: #2a2a2a;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            cursor: pointer;
            margin: 0;
            transform: rotate(-90deg);
            transform-origin: center center;
            }
            .volume-slider-wrapper .volume::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            background: #e8e8e8;
            border-radius: 50%;
            cursor: pointer;
            }
            .volume-slider-wrapper .volume::-moz-range-thumb {
            width: 12px;
            height: 12px;
            background: #e8e8e8;
            border-radius: 50%;
            cursor: pointer;
            border: none;
            }

            .audio-card .time {
            color: #888;
            font-variant-numeric: tabular-nums;
            flex: 1;
            text-align: right;
            font-size: 11px;
            min-width: 80px;
            white-space: nowrap;
            }
            .audio-card .link {
            display: block;
            margin-top: 14px;
            color: #888;
            text-decoration: none;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border-top: 1px solid #222;
            padding-top: 12px;
            text-align: right;
            }
            .audio-card .link:hover { color: #e8e8e8; }

            #list-of-audios {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 20px 0;
            }
            #list-of-audios a {
            color: #fff;
            background: #000;
            font-weight: 900;
            text-decoration: none;
            font-size: 12px;
            padding: 2px 6px;
            display: inline-block;
            border: 1px solid #2a2a2a;
            border-radius: 2px;
            transition: all 0.15s ease;
            }
            #list-of-audios a:hover,
            #list-of-audios a.current {
            color: #fff;
            background: #2a2a2a;
            border-color: #444;
            }

            @media (max-width: 380px) {
            .audio-card { padding: 18px 16px 14px; font-size: 11px; }
            .audio-card .title { font-size: 12px; }
            .audio-card .controls { gap: 10px; }
            .volume-slider-wrapper { height: 96px; }
            .volume-slider-wrapper .volume,
            .volume-slider-wrapper .volume-track { width: 76px; }
            }
            @media (max-height: 560px) {
            #audio-card-container {
            transform: translate(-50%, -50%) scale(0.92);
            transform-origin: center center;
            }
            }
                 `;
                 document.head.appendChild(style);
             };

             // ===== UTILIDADES =====
             const formatTime = (seconds) => {
                 if (isNaN(seconds) || !isFinite(seconds)) return "00:00";
                 const s = Math.floor(seconds);
                 const m = Math.floor(s / 60);
                 const rs = s % 60;
                 return `${m < 10 ? "0" + m : m}:${rs < 10 ? "0" + rs : rs}`;
             };

             const getHashId = () => {
                 const h = window.location.hash;
                 return h ? h.replace(/^#/, "") : "";
             };

             // ===== LOGICA =====
             let container = document.getElementById('audio-card-container');
             if (!container) {
                 container = document.createElement('div');
                 container.id = 'audio-card-container';
                 document.body.appendChild(container);
             }

             let currentAudio = null;

             const hideCard = () => {
                 container.classList.remove('visible');
                 container.innerHTML = '';
                 if (currentAudio) {
                     currentAudio.pause();
                     currentAudio.removeAttribute('src');
                     currentAudio.load();
                     currentAudio = null;
                 }
                 // Marcar link actual como no-activo
                 document.querySelectorAll('#list-of-audios a.current').forEach(a => a.classList.remove('current'));
             };

             const addField = (card, label, value, extraClass = '') => {
                 const f = document.createElement('div');
                 f.className = `field ${extraClass}`;
                 f.innerHTML = `<span class="label">${label}</span><span class="value"></span>`;
                 f.querySelector('.value').textContent = value;
                 card.appendChild(f);
             };

             const showCard = (id) => {
                 const data = audios[id];
                 if (!data) {
                     hideCard();
                     return;
                 }

                 container.innerHTML = '';
                 container.classList.add('visible');

                 // Resaltar link en la lista
                 document.querySelectorAll('#list-of-audios a.current').forEach(a => a.classList.remove('current'));
                 const currentLink = document.querySelector(`#list-of-audios a[href="#${CSS.escape(id)}"]`);
                 if (currentLink) currentLink.classList.add('current');

                 const card = document.createElement('div');
                 card.className = 'audio-card';

                 const closeBtn = document.createElement('button');
                 closeBtn.className = 'close-btn';
                 closeBtn.textContent = 'x';
                 closeBtn.addEventListener('click', hideCard);
                 card.appendChild(closeBtn);

                 addField(card, 'Disco', data.disk);
                 addField(card, 'Track', data.track);
                 addField(card, 'Artista', data.author);
                 addField(card, 'Titulo', data.title, 'title');

                 const audio = document.createElement('audio');
                 audio.preload = 'metadata';
                 audio.src = data.audio;
                 card.appendChild(audio);
                 currentAudio = audio;

                 const controls = document.createElement('div');
                 controls.className = 'controls';

                 // Boton play/pause con SVG
                 const playBtn = document.createElement('button');
                 playBtn.className = 'play-btn';
                 playBtn.setAttribute('aria-label', 'Play');
                 playBtn.innerHTML = `
                     <span class="icon-play">${ICONS.play}</span>
                     <span class="icon-pause">${ICONS.pause}</span>
                 `;
                 const togglePlay = () => {
                     if (audio.paused) {
                         audio.play();
                     } else {
                         audio.pause();
                     }
                 };
                 playBtn.addEventListener('click', togglePlay);
                 controls.appendChild(playBtn);

                 // Control de volumen con icono + slider popover
                 const volumeControl = document.createElement('div');
                 volumeControl.className = 'volume-control';

                 const volumeIconBtn = document.createElement('button');
                 volumeIconBtn.type = 'button';
                 volumeIconBtn.className = 'volume-icon-btn';
                 volumeIconBtn.setAttribute('aria-label', 'Volumen');
                 volumeIconBtn.innerHTML = ICONS.volume;
                 volumeIconBtn.addEventListener('click', (e) => {
                     e.stopPropagation();
                     volumeControl.classList.toggle('active');
                 });
                 volumeControl.appendChild(volumeIconBtn);

                 const sliderWrapper = document.createElement('div');
                 sliderWrapper.className = 'volume-slider-wrapper';
                 const volume = document.createElement('input');
                 volume.type = 'range';
                 volume.className = 'volume';
                 volume.min = '0';
                 volume.max = '1';
                 volume.step = '0.01';
                 volume.value = '0.7';
                 volume.addEventListener('input', () => {
                     audio.volume = parseFloat(volume.value);
                 });
                 sliderWrapper.appendChild(volume);
                 volumeControl.appendChild(sliderWrapper);
                 controls.appendChild(volumeControl);

                 // Tiempo
                 const time = document.createElement('span');
                 time.className = 'time';
                 time.textContent = '00:00 / 00:00';
                 controls.appendChild(time);

                 card.appendChild(controls);

                 // Link al disco
                 const link = document.createElement('a');
                 link.className = 'link';
                 link.href = data.original;
                 link.target = '_blank';
                 link.rel = 'noopener';
                 link.textContent = 'Ir al disco';
                 card.appendChild(link);

                 container.appendChild(card);

                 // Eventos de audio
                 audio.addEventListener('loadedmetadata', () => {
                     time.textContent = `00:00 / ${formatTime(audio.duration)}`;
                     if (AUTOPLAY) {
                         audio.play().catch(() => {});
                     }
                 });
                 audio.addEventListener('timeupdate', () => {
                     time.textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
                 });
                 audio.addEventListener('play', () => {
                     playBtn.classList.add('playing');
                     playBtn.setAttribute('aria-label', 'Pause');
                 });
                 audio.addEventListener('pause', () => {
                     playBtn.classList.remove('playing');
                     playBtn.setAttribute('aria-label', 'Play');
                 });
                 audio.addEventListener('ended', () => {
                     playBtn.classList.remove('playing');
                     playBtn.setAttribute('aria-label', 'Play');
                 });
             };

             // Cerrar el popover de volumen al hacer click fuera
             document.addEventListener('click', (e) => {
                 if (!e.target.closest('.volume-control')) {
                     document.querySelectorAll('.volume-control.active').forEach(el => el.classList.remove('active'));
                 }
             });

             // ===== LISTA DE AUDIOS =====
             const populateList = () => {
                 const list = document.getElementById('list-of-audios');
                 if (!list) return;
                 const keys = Object.keys(audios).sort();
                 if (keys.length === 0) return;
                 list.innerHTML = keys.map(k => `<a href="#${k}">${k}</a>`).join('');
             };

             // ===== EVENTOS =====
             const handleHashChange = () => {
                 const id = getHashId();
                 if (id && audios[id]) {
                     showCard(id);
                 } else {
                     hideCard();
                 }
             };

             window.addEventListener('hashchange', handleHashChange);

             const init = () => {
                 injectStyles();
                 populateList();
                 handleHashChange();
             };

             if (document.readyState === 'loading') {
                 document.addEventListener('DOMContentLoaded', init);
             } else {
                 init();
             }

             window.AudioCardController = {
                 show: showCard,
                 hide: hideCard,
                 setAutoplay: (v) => { AUTOPLAY = !!v; }
             };
         })();
        </script>
