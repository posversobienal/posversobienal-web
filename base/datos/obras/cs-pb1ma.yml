             // ===== SVG ICONS =====
             const ICONS = {
                 play: `
            <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
                <circle cx="12" cy="12" r="11" stroke="currentColor" stroke-width="1.5" fill="none"/>
