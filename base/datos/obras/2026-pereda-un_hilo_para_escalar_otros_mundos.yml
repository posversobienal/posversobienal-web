contenido: |
  La instalación *Un hilo para escalar otros mundos*. Amaru y Kai - kai surge de un mundo animado e inanimado procedente del cosmos, del mar y de la tierra, ubicado entre los límites de la vida y de la muerte.

  Ovillada o desovillada, tensada, torsada o trenzada, la hebra de lana de vellón da forma a un imaginario originario y fantástico en tanto reúne representaciones de seres que proceden de ecosistemas ocultos, de mundos aéreos o de profundidades acuáticas abisales (microorganismos, artrópodos, peces, anfibios, reptiles, aves...). Muchas resultan especies mejor preparadas para soportar un exterminio ya que su adaptación a condiciones adversas del entorno es superior a la de otros seres.

  En un tiempo inquietante y perturbador, la manipulación del hilo tranquiliza a la artista, colocándola en sintonía con sus sentidos y con su propia memoria. A modo de estrategia de resistencia, este trabajo le permite traer en acto la memoria ancestral colectiva en tanto la integra y le dicta de qué manera anudar, amarrar, ligar, trenzar... Se trata de saberes transmitidos y recibidos, un proceso de acciones vinculantes. La materia lana, la fibra, resulta un recurso potente ante la adversidad y el padecimiento, ofreciéndole cobijo, abrigo y amarre. Tiende un puente que incluye las complejidades sociales, los contenidos simbólicos, sagrados e ideológicos que reseñan valores profundos de la memoria americana. Asimismo, le trae saberes que residen tanto en el universo cosmogónico precolombino como en la América actual indígena, mestiza, criolla e inmigrante.
