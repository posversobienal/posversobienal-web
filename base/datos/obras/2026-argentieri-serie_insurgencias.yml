contenido: |
  El proyecto propone narraciones que convocan a una insurgencia. Se construye desde la idea de una arqueología personal del territorio: una búsqueda íntima y sensible que no pretende observar el paisaje como objeto de estudio, sino habitarlo como parte viva de un entramado de memorias, heridas, resistencias y vínculos. Cada material, textura y forma funciona como un archivo sensible donde conviven lo ancestral y lo contemporáneo: vestigios, fragmentos y huellas de cuerpos, recorridos y tiempos superpuestos.

  La propuesta dialoga con las resistencias femeninas y ancestrales frente a las múltiples formas de violencia ejercidas sobre los cuerpos-territorios, entendidos no solo como espacio físico, sino como memoria colectiva, lugar político y superficie de inscripción cultural. La noción de insurgencia atraviesa toda la obra como una fuerza vital compartida entre humanos y no humanos. Plantas, huesos, restos orgánicos y materiales encontrados aparecen como presencias activas que participan en la construcción de sentido; no son elementos decorativos, sino entidades portadoras de memoria y agencia. La obra propone así una mirada relacional donde la naturaleza deja de ser recurso para convertirse en sujeto de intercambio, resistencia y transformación.

  En este proceso, redescubrir el territorio significa escuchar aquello que persiste debajo de las capas del olvido: las voces ancestrales, las memorias silenciadas y las formas de resistencia que continúan emergiendo desde la tierra y desde los cuerpos.

  > *“Ser uno es siempre devenir con muchos”* — Donna Haraway
