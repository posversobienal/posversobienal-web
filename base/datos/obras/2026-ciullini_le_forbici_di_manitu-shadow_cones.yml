contenido: |
  *Shadow Cones*, el álbum creado en colaboración entre Daniele Ciullini y  Le Forbici di Manitù (Vittore Baroni y Manitù Rossi)   recoge huellas de las "zonas de sombra" donde las historias y los recuerdos de los tres autores se cruzan y se superponen, tomando la ciudad de Florencia —base de operaciones de Ciullini y punto de encuentro equidistante entre las ciudades de Viareggio y Reggio Emilia— como su hilo conductor y leitmotiv, con toda su variedad de influencias históricas, culturales, arquitectónicas y paisajísticas.

  Desde la trágica figura de Girolamo Savonarola sacrificado en la plaza pública hasta el mundo de la alta costura, que tiene uno de sus hogares privilegiados en la capital toscana; desde estimados pioneros de la investigación electrónica como Pietro Grossi y Albert Mayr, que echaron raíces en Florencia durante las glorias de la escena new wave de principios de los 80; desde el círculo artístico y literario que giraba en torno a la revista Lacerba durante los inicios del futurismo hasta los grandes poetas y escritores del otro lado del Canal de la Mancha, enterrados en el peculiar Cementerio Inglés, el álbum evoca las luces y, sobre todo, las sombras de una ciudad que nunca ha carecido de lugares misteriosos y arcanos, conspiraciones políticas o acontecimientos dramáticos.

  Shadow Cones es una deslumbrante fusión de canción, collage sonoro y experimentación vocal, ambient-drone y sonidos industriales, fascinaciones góticas y un humor negro típicamente toscano. Apunta un tributo muy transversal a una ciudad que, como cantaba Odoardo Spadaro, «es tan vieja y, sin embargo, nunca envejece».
