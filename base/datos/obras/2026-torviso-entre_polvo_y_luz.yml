contenido: |
  La obra de Silvina Torviso nos confronta con un oxímoron originario: un gran corpúsculo que, en su aparente fragilidad de tinta plateada sobre papel vegetal, despliega una multitud de sentidos latentes. Es grano, semilla, espora, polen, bacteria, virus, mundo, planeta, cosmos.

  En esta transición de lo micro a lo macro, de lo orgánico a lo inorgánico, la pieza desactiva las dicotomías tradicionales para integrarlas en un entramado de pliegues vibrátiles. Sin embargo, este diseño no es meramente contemplativo; encierra una potencial forma de peligro. La ambigüedad de su escala y su naturaleza fronteriza entre lo vivo y lo inerte evocan la latencia de una amenaza invisible: aquello que muta, que contagia, que resiste en las sombras y que posee la fuerza disruptiva de alterar el orden establecido.

  El diseño del corpúsculo se vuelve así una zona de riesgo y fricción. Sus pliegues, si bien funcionan como refugios donde la vida puede resguardarse y resistir, son también el territorio de lo impredecible. Es en esa tensión donde lo invisible insiste, desafiante, en hacerse mundo.
