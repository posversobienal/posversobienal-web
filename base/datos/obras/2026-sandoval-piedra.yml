contenido: |
  En *Piedra*, el artista no representa el dolor ni la memoria: los encarna a través de una acción de una economía formal extrema y una densidad poética brutal. Colocar un metate de piedra precolombino directamente sobre su pecho desnudo es un acto de enorme gravitación histórica. El metate —herramienta comunitaria de molienda, ligada a la supervivencia, a la soberanía alimentaria ancestral y al útero de la tierra originaria— deja de ser un objeto arqueológico pasivo para convertirse en una carga viva, en un peso histórico y político que presiona directamente sobre los órganos vitales del artista.

  La acción se tensa y se vuelve sagrada a través de la combustión. El metate, impregnado de alcohol, es encendido. Mientras el fuego consume el combustible sobre la superficie pétrea, ocurre un acontecimiento fenomenológico y físico inmediato: el calor penetra la roca, y el peso de la piedra, en contacto directo con la piel, empieza a reflejar de manera casi subliminal el pulso cardíaco del artista.

  *Piedra* es una performance silenciosa pero ensordecedora. La imagen del artista tendido, sosteniendo el fuego y el peso del pasado sobre su centro vital, es una analogía perfecta de América Latina: un continente que soporta el peso de su historia colonial sobre el pecho, pero cuyo pulso subterráneo e invisible sigue latiendo, insumiso, bajo las llamas.
