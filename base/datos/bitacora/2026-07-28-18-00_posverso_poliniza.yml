detalle: |
  La Bienal Internacional de Poesía Experimental de Argentina anuncia «POSVERSO POLINIZA», una extensión de su programación en sedes asociadas de CABA bajo el concepto del «desborde del borde».

contenido: |
  A partir de un guiño al histórico poeta experimental Edgardo Antonio Vigo, quien acuñó la frase "desborde del borde», esta expansión de POSVERSO BIENAL no solo amplía la programación, sino que profundiza la propuesta de romper los límites geográficos y disciplinares, llevando la experiencia poética experimental desde su sede central en Junín hacia diversos espacios culturales de la capital.

  Como un organismo vivo que busca nuevos ecosistemas para multiplicarse, esta iniciativa traslada parte de la programación de **arte sonoro** y **performance** directamente al espacio público y sedes asociadas de CABA.

  Bajo la curaduría de Soledad Sánchez Goldar, se presentará la sección “Poética de la interferencia”, una serie de acciones urbanas que transformarán el tránsito diario en un hecho artístico y poético, con la participación de lxs artistas Luciana Martínez, Inti Pujol y Exe Ramos. Además, las sedes asociadas hospedarán propuestas de arte sonoro y música experimental de las que formarán parte artistas nacionales e internacionales.

  <br>

  ## SEDES ALIADAS EN CABA

  Para propiciar la confluencia de las búsquedas estéticas de la BIENAL con la escena porteña, POSVERSO articula su programa con dos de los espacios más vibrantes y experimentales de la ciudad.

  <br>
  **704 Oficina de Arte**

  Ubicado en el corazón del centro porteño (Florida 336), este emblemático espacio autogestivo funciona en el séptimo piso de un clásico edificio de oficinas. Coordinado por Nana Simone Micheli, se destaca por promover el intercambio interdisciplinario, las residencias, el arte de acción y las búsquedas sonoras no convencionales.

  <br>
  **Espacio Panorama**

  Un punto de encuentro clave para la cultura independiente, las artes visuales y la escena experimental de CABA. Conocido por albergar encuentros sonoros, potentes performances de ruido y experimentación internacional, es el terreno perfecto para la propuesta nómade e inmersiva de la Bienal.
