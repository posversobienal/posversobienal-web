contenido: |
  Como antesala al Festival de Radioarte, **Radio Posverso** —la frecuencia institucional de la **Bienal**— da comienzo a sus emisiones oficiales con un programa especial dedicado a **1 Minute Autohypnosis**, proyecto desarrollado por Mute Sound bajo la autoría del artista conceptual español **Pedro Bericat**. Esta emisión inaugural reúne una selección representativa de las numerosas ediciones que componen la obra, señalando claramente el tono curatorial y conceptual de la emisora.

  **1 Minute Autohynopsis** es un proyecto internacional y multidisciplinar de arte sonoro editado por el sello discográfico independiente Mute Sound. Iniciado originalmente en 1988, el concepto central consiste en recopilar piezas sonoras experimentales, ruidos o composiciones electrónicas de vanguardia que tienen una duración exacta de un minuto. Estas pistas funcionan como detonantes de estados de abstracción o autohipnosis mediante la repetición y el minimalismo acústico.

  Con la presentación de este especial, la Bienal reafirma su compromiso con la difusión de creadores de trayectoria destacada y con la legitimación de prácticas experimentales, inaugurando sus transmisiones con una obra de relevancia internacional que profundiza en el **arte sonoro en sus diversas vertientes, la música experimental, el noise y la investigación fonética**.
