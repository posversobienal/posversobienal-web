detalle: |
  Alessandra Arnò, directora de la plataforma Visualcontainer y experta en video e inteligencia artificial, tendrá a su cargo una curaduría de videoarte italiano contemporáneo.

contenido: |
  **Ecos Persistentes**, la curaduría de Alessandra Arnò,   reúne siete obras en video que interrogan aquello que permanece bajo la superficie del presente: huellas, memorias, gestos, heridas y formas de relación que continúan actuando incluso cuando su origen parece lejano, removido o casi imperceptible.

  El título evoca una persistencia sutil, un retorno no nostálgico sino activo. Los ecos que atraviesan esta selección no reconstruyen un pasado perdido; más bien, abren una zona de escucha en la que el cuerpo, la tierra, la palabra, el animal, la materia y la imagen se convierten en lugares de transformación.

  Esta sección italiana se desplaza entre prácticas performativas, videoarte, poesía visual, investigación sonora y ecologías de lo viviente.

