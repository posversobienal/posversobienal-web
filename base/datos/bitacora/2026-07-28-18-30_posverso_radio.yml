  La BIENAL presenta su emisora digital, espacio radiofónico destinado a funcionar como un archivo vivo de las prácticas sonoras experimentales.

contenido: |
  Como parte de sus líneas de investigación y exhibición, la Bienal presenta Radio POSVERSO, su emisora digital concebida como un archivo vivo y un espacio de transmisión dedicado a la curaduría, difusión y legitimación de prácticas artísticas sonoras.

  La emisora se establece como un territorio idóneo para albergar propuestas de arte sonoro, música experimental, poesía de la voz y experimentación fonética, ensanchando los límites tradicionales de la producción artística hacia el campo de lo auditivo.

  ## El Festival de Radioarte de POSVERSO

  En consonancia con sus ejes programáticos, durante el mes de septiembre Radio Posverso transmitirá la selección oficial resultante de la convocatoria abierta de radioarte de la BIENAL.

  Esta programación especial constituye el **Festival de Radioarte de POSVERSO**, un evento curatorial de relevancia internacional que cuenta con la dirección y curaduría del reconocido artista e investigador brasileño Yuri Bruscky. A través de esta emisión, la Bienal reafirma su compromiso con la vanguardia sonora, ofreciendo a la comunidad académica, artística y al público general una plataforma de escucha crítica y de circulación para obras radiofónicas de alta densidad conceptual.

