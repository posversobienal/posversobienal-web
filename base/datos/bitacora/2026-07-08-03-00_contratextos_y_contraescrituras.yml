contenido: |
  **Hotel DaDA centro de poéticas expandidas** dio apertura el sábado 4 de julio a la exhibición titulada **"CONTRATEXTOS Y CONTRAESCRITURAS"**, una ambiciosa propuesta que reúne una destacada selección de obras pertenecientes al acervo de la **BIENAL POSVERSO** (Bienal Internacional de Poesía Experimental de Argentina).

  Con la curaduría a cargo de **Silvio De Gracia**, curador y director general de la Bienal, la muestra se configura como un territorio de confrontación y cuestionamiento de los lenguajes tradicionales. A través de desvíos estéticos, escrituras asémicas y contranarrativas, las obras presentadas desafían los límites de la palabra y la imagen.

  La exhibición cuenta con una fuerte impronta internacional, reuniendo a un prestigioso grupo de creadores contemporáneos: **Javier Abreu** (Uruguay), **Angélica Chio** (México), **Stephan Groß** (Alemania), **Pia Höhfeld** (Alemania), **Gaby Lobato** (México), **Guillermo Pérez Raventós** (Argentina) y **Tulio Restrepo** (Colombia).

  **Un hito en el camino a la BIENAL POSVERSO**

  Esta exposición no solo representa una oportunidad única para acercarse a la poesía experimental, sino que se posiciona como un **evento pre-bienal fundamental**, un prólogo necesario y un laboratorio de visibilidad rumbo a la **BIENAL POSVERSO**, cuya apertura oficial está programada para el próximo **22 de agosto**.

  En palabras del curador, "CONTRATEXTOS Y CONTRAESCRITURAS" propone una mirada crítica sobre el acto de escribir y leer en la era contemporánea. Nos enfrenta a obras que desafían los límites tradicionales de la literatura y el arte visual, explorando la poesía experimental, la deconstrucción del lenguaje y las escrituras disidentes.

  _La contraescritura irrumpe como una escritura artística que apunta a lo no discursivo, al violentamiento de la racionalidad y de los sentidos incontestables. En su deseo de subvertir las narrativas institucionalizadas por el lenguaje y la palabra, las contraescrituras revuelven los signos, prodigándose en alfabetos poéticos e inventados, en escrituras asémicas, en textos borrados que escapan al significado, pero que afectan desde lo visual y lo sensorial._
