detalle: |
  El jueves 22 de agosto, el SUM Mario Meoni de la UNNOBA se convirtió en el epicentro del arte y las poéticas experimentales.

contenido: |
   Con una gran concurrencia de público, artistas, autoridades universitarias y referentes de la cultura local y regional, quedó formalmente inaugurada la muestra central de la Bienal Posverso “Del encantamiento y el horror. Capítulo 1” en el SUM Mario Meoni de la UNNOBA.

   La apertura estuvo marcada por un recorrido inaugural donde los asistentes pudieron disfrutar de instalaciones de vanguardia, obras multidisciplinarias y propuestas que dialogan directamente con las nuevas tecnologías, las poéticas experimentales y las múltiples realidades del mundo contemporáneo.


   POSVERSO reúne obras y propuestas de 60 artistas de Argentina y de distintos países, en torno de las prácticas poéticas expandidas y el cruce entre diferentes lenguajes artísticos.

   La muestra central “Del encantamiento y el horror. Capítulo 1”, curada por Silvio De Gracia y Ana Montenegro, directores de la Bienal, presenta trabajos de Marilá Dardot (Brasil), Mounir Fatmi (Marruecos), Cecilia Ivanchevich + Ensamble FØRK-DA (Argentina), Maurizio Mancioli (Suiza/Italia), Bruno Mesz, Sebastián Tedesco y María Zegna (Argentina), Teresa Pereda (Argentina), Darija S. Radakovic (Canadá), Silvia Rivas (Argentina), Daniel Sarobe (Argentina), Santiago Sierra (España) y Silvina Torviso (Argentina).

   La selección reúne obras de gran volumen, videoperformances, instalaciones y dispositivos interactivos.

   ## Junín como punto de partida

   POSVERSO nació en Junín y propone una mirada contemporánea sobre la poesía experimental, entendida no solamente como una práctica vinculada a la literatura, sino como un territorio de encuentro entre distintas disciplinas y formas de producción artística.

   En esta segunda edición, bajo el eje “Del encantamiento y el horror”, la Bienal propone explorar nuevas formas de relación con el mundo a través de prácticas que desbordan las clasificaciones tradicionales del arte. La propuesta incorpora artes visuales, performance, música experimental, arte sonoro y prácticas electrónicas, entre otros lenguajes. La edición 2026 se desarrollará entre el 22 de agosto y el 3 de octubre, con actividades en diferentes espacios de Junín y la Ciudad Autónoma de Buenos Aires.

   La programación completa se puede ver en: posversobienal.com.ar. “Para la Secretaría de Cultura de la UNNOBA, acompañar esta iniciativa forma parte de una concepción de la Universidad como institución abierta a la comunidad y comprometida con la promoción de la cultura, la creación artística y el intercambio de saberes”, expresó el coordinador del área, Alejandro Pietrobón.

   “La presencia de POSVERSO en el ámbito universitario permite, además, acercar al público de la región expresiones artísticas contemporáneas y experimentales, generando un espacio de encuentro entre artistas, estudiantes, docentes, investigadores y la comunidad”, añadió.
