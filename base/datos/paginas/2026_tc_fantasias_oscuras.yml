contenido: |
  > “Quien con monstruos lucha debe cuidar de no convertirse a su vez en monstruo. Cuando miras largo tiempo a un abismo, el abismo también mira dentro de ti.”<br>Nietzsche, Más allá del bien y del mal (Aforismo 146).
  {.text-end}

  <br>

  En el prólogo de *El libro de los seres imaginarios*, Jorge Luis Borges anota: “ignoramos el sentido del dragón, como ignoramos el sentido del universo, pero algo hay en su imagen que concuerda con la imaginación de los hombres”. Nietzsche, en uno de los aforismos más célebres de *Más allá del bien y del mal*, nos advierte sobre los riesgos de enfrentarnos al abismo y terminar corrompidos o infestados por su malignidad. En *Fantasías oscuras*, la muestra que acoge muy oportunamente CASA NEGRA, se anudan cuatro propuestas que se mueven en una perturbadora zona de sombras, y que se nutren por igual de lo fantástico y lo monstruoso.

  En _**Quimeras por defecto**_, **Romina Paesani** presenta una serie de dibujos compuestos en tinta sobre papel, en la que despliega un desconcertante bestiario personal que se resiste a cualquier clasificación. Las criaturas que materializa no provienen del pasado ni de los repertorios fantásticos de la literatura, sino que emergen de una mirada sarcástica y despiadada que engendra monstruos a partir de la realidad inmediata. Sus criaturas sintomatizan la monstruosidad y la crueldad de nuestro presente. En sus dibujos, el terror asume la forma de seres híbridos, en los que se mixturan desaforadamente rasgos de humanos y de animales. En las frases-título que acompañan cada ilustración se revelan inequívocas referencias políticas, sociales y culturales. A primera vista, los dibujos parecen provenir de un desvarío onírico, pero detrás del inevitable barniz surrealista se agitan pesadillas más preocupantes y más estremecedoras que las que puede pergeñar el inconsciente. Las criaturas que Paesani alumbra y extrae de la oscuridad nos hablan de terrores contemporáneos, de maldades que solo pueden representarse a través del espejo de lo deforme y lo monstruoso. Sus criaturas, en las que se desbordan las fronteras entre lo vivo y lo muerto, entre lo humano y lo no humano, entre lo existente y lo inexistente, ya no disputan sus batallas en el campo de la imaginación de los hombres, sino en el de nuestra inquietante actualidad.

  En el dibujo _**Ciudad de pájaros perdidos y seres sin recuerdos**_, **Sandra Pintos** emplea la imaginería fantástica como interfaz entre pasado y presente, entre los fantasmales horrores medievales y los horrores del mundo contemporáneo. La obra pertenece a la serie La aldea de los caídos, en la que la artista recurre a un profuso buceo y proceso de apropiación y actualización de fantasías de maestros renacentistas y góticos, como Masaccio, Pisanello, Piero della Francesca, Giotto y Paolo Ucello. Esta estrategia creativa hace que la serie funcione como un puente entre dos mundos: pasado y presente se funden y se confunden.

  La escena, plena de densidad onírica, nos presenta una ciudad pesadillesca, donde figuras demujeres son acosadas por pájaros que las picotean en la cabeza y en el cuerpo. A la plaga de los pájaros se suman otros seres minúsculos, pulgas, ácaros y gusanos, que provocan al espectador con una sensación casi física de malevolencia y repulsión. En la composición de la ciudad, enfatizando los tráficos entre pasado y presente, se mezclan elementos de una urbe renacentista con fachadas y referencias del propio barrio de la artista. El picoteo de los pájaros, que nos recuerda inevitablemente a Hitchcock, parece aludir a la inoculación de narrativas engañosas, capaces de adormecer la conciencia y extraviar el juicio. Como resultado, quedan esos extraños personajes que vagan por la ciudad vacía, como insomnes, delatando el síntoma de una sociedad lobotomizada, librada a los caprichos de algún tiranuelo de ultraderecha. El trasvase entre pasado y presente adquiere así dimensiones dramáticas, fuertemente penosas en nuestro contexto actual.

  _**Shadow Cones**_, el álbum creado en colaboración entre **Daniele Ciullini y Le Forbici di Manitù (Vittore Baroni y Manitù Rossi)** recoge huellas de las "zonas de sombra" donde las historias y los recuerdos de los tres autores se cruzan y se superponen, tomando la ciudad de Florencia — base de operaciones de Ciullini y punto de encuentro equidistante entre las ciudades de Viareggio y Reggio Emilia— como su hilo conductor y leitmotiv, con toda su variedad de influencias históricas, culturales, arquitectónicas y paisajísticas. Desde la trágica figura de Girolamo Savonarola sacrificado en la plaza pública hasta el mundo de la alta costura, que tiene uno de sus hogares privilegiados en la capital toscana; desde estimados pioneros de la investigación electrónica como Pietro Grossi y Albert Mayr, que echaron raíces en Florencia durante las glorias de la escena new wave de principios de los 80; desde el círculo artístico y literario que giraba en torno a la revista Lacerba durante los inicios del futurismo hasta los grandes poetas y escritores del otro lado del Canal de la Mancha, enterrados en el peculiar Cementerio Inglés, el álbum evoca las luces y, sobre todo, las sombras de una ciudad que nunca ha carecido de lugares misteriosos y arcanos, conspiraciones políticas o acontecimientos dramáticos.

  _Shadow Cones_ es una deslumbrante fusión de canción, collage sonoro y experimentación vocal, ambient-drone y sonidos industriales, fascinaciones góticas y un humor negro típicamente toscano. Apunta un tributo muy transversal a una ciudad que, como cantaba Odoardo Spadaro, «es tan vieja y, sin embargo, nunca envejece».

  Inspirada en _La lección de anatomía de Rembrandt_, pintada en 1632, y en la película surrealista de 1929 _Un perro andaluz_, de Salvador Dalí y Luis Buñuel, la compilación sonora _**Archi Sickness**_, de **Mounir Fatmi**, aborda la cuestión de nuestra relación con las imágenes violentas en los medios de comunicación y la televisión. Compuesta por modulaciones de frecuencia entrelazadas, generadas por algún dispositivo médico automatizado o máquina de comunicación moderna, las bandas sonoras transportan al oyente a un mundo dominado por la tecnología, que transcribe la frialdad, la falta de compasión y la indiferencia del espectador contemporáneo.

  Zona de sombras atemporales. Derivas en lo fantástico. _Fantasías oscuras_ devela su textura crítica en una conjugación de signos que nos sumerge en una poética de la incomodidad y el desasosiego.

  Silvio De Gracia, 22 de marzo de 2026.
  {.firma}
