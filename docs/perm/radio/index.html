<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POSVERSO Radio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="lib/css/style.css">
    <link rel="shortcut icon" href="./img/favicon.svg" type="image/x-icon" />

    <script></script>
</head>
<body>
    <main class="container">
        <header class="header">
            <a href="/" target="_blank"><img src="./img/a_pv.svg" title="volver a POSVERSO Bienal" class="logo-a-pv"></a>
            <a href="./">
                <img class="logo-posverso-radio" src="./img/logo-posverso.svg" title="POSVERSO Radio">
            </a>
        </header>

        <section class="player">
            <button id="btn-play" class="btn-play">Escuchar</button>
            <div class="player-controls hidden" id="player-controls">
                <button id="btn-toggle" class="btn-toggle" aria-label="Pausa"></button>
                <div class="volume-wrap">
                    <span class="vol-icon" id="vol-icon"></span>
                    <input type="range" id="vol-slider" min="0" max="100" value="80" class="vol-slider">
                </div>
                <span class="time-display" id="time-display">00:00:00</span>
            </div>
            <audio id="radio" preload="none">
                <source id="radiosource" src="" type="audio/ogg">
            </audio>
        </section>

        <section class="ficha" id="ficha">
            <div class="ficha-status">
                <span class="dot" id="status-dot"></span>
                <span id="status-text">Desconectado</span>
            </div>

            <div class="ficha-track">
                <div class="track-number" id="track-number"></div>
                <div class="track-info">
                    <h2 class="track-title" id="track-title">&mdash;</h2>
                    <p class="track-artist" id="track-artist">&mdash;</p>
                </div>
            </div>

            <div class="ficha-disc" id="ficha-disc">
                <div class="disc-row">
                    <span class="disc-label">Album</span>
                    <span class="disc-value" id="disc-name">&mdash;</span>
                </div>
                <div class="disc-row">
                    <span class="disc-label">Fecha</span>
                    <span class="disc-value" id="disc-date">&mdash;</span>
                </div>
                <div class="disc-row disc-row-last">
                    <span class="disc-label">Fuente</span>
                    <span class="disc-value" id="disc-url">&mdash;</span>
                </div>
            </div>
        </section>

        <footer>
            <br><br>
            <p class="center">
                Esta radio se distribuye gracias a
                <a href="https://giss.tv/" target="_blank" title="G.I.S.S."><b>G.I.S.S.</b>
                    <img src="./img/giss-logo_vector_white.svg" alt="G.I.S.S." class="logo_giss">
                </a>. También podés escucharla desde su
                <a id="gissplayer" href="#" target="_blank">reproductor oficial</a>
                o directamente desde el <a id="streamdirecto" href="#" target="_blank">propio streaming</a>.
            </p>
        </footer>

    </main>



    <script src="lib/js/icecast-metadata-stats-0.1.12.min.js"></script>
    <script src="lib/js/radio.js"></script>
    <script src="lib/js/clipboard.js"></script>
</body>
</html>
