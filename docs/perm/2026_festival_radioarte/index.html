<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Festival de Radioarte - POSVERSO 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="lib/css/style.css">
    <link rel="shortcut icon" href="./img/favicon.svg" type="image/x-icon" />
</head>
<body>
    <main class="container">
        <header class="header">
            <a href="/" target="_blank"><img src="img/a_pv.svg" title="volver a POSVERSO Bienal" class="logo-a-pv"></a>
            <img class="logo-posverso" src="img/logo-posverso.svg" title="POSVERSO Bienal">
        </header>

        <section class="catalogo" id="catalogo">
            <h1 class="catalogo-titulo">Festival de Radioarte - POSVERSO 2026</h1>

            <p>Escuchar en: <a href="/perm/radio/">POSVERSO Radio</a></p>
            <p>Programa completo del festival: <a href="./programa/">ONLINE</a> -
                <a href="./programa/poverso_2026--festival_de_radioarte--programa_completo.pdf" target="_blank">PDF</a>
            </p>

            <br>

            <ul class="catalogo-lista" id="catalogo-lista"></ul>
        </section>

        <div class="panel-overlay" id="panel-overlay"></div>

        <section class="panel" id="panel">
            <button class="panel-cerrar" id="panel-cerrar" aria-label="Cerrar">&times;</button>
            <div class="panel-contenido" id="panel-contenido"></div>
        </section>

        <!-- Lightbox para ampliar imagenes -->
        <div class="lightbox" id="lightbox">
            <button class="lightbox-cerrar" id="lightbox-cerrar" aria-label="Cerrar">&times;</button>
            <img class="lightbox-img" id="lightbox-img" src="" alt="">
        </div>

    </main>

    <script src="lib/js/marked.min.js"></script>
    <script src="lib/js/markdown.js"></script>
    <script src="lib/js/catalogo.js"></script>
    <script src="lib/js/panel.js"></script>
    <script src="lib/js/main.js"></script>
</body>
</html>
